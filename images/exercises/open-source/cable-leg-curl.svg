<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Сгибание одной ноги в кроссовере с манжетой</title>
  <desc id="desc">Человек стоит лицом к стойке блока, сгибает одну ногу назад; трос соединён с манжетой на голеностопе.</desc>
  <rect width="640" height="420" rx="24" fill="#f4f8f5"/>
  <g fill="none" stroke="#25342e" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
    <!-- cable station -->
    <path d="M92 72v272M92 82h66M92 344h72M158 82v262"/>
    <path d="M119 95v218" stroke="#a9b6af" stroke-width="6"/>
    <circle cx="119" cy="318" r="19" fill="#fff"/>
    <circle cx="119" cy="318" r="7" fill="#a9b6af" stroke="none"/>
    <!-- athlete head, torso and braced arm -->
    <circle cx="376" cy="76" r="31" fill="#fff"/>
    <path d="M357 109c-8 17-15 37-17 62l-3 43c-1 15 9 27 23 29l37 4c15 1 28-9 30-24l7-47c3-22-3-45-16-62l-20-15" fill="#fff"/>
    <path d="M354 126l-38 21-41 1-45-21"/>
    <path d="M230 127l-19-6-17 4 12 12 22 9"/>
    <!-- supporting leg -->
    <path d="M363 245l-13 57-11 70 39 5 25-73 16-56" fill="#fff"/>
    <path d="M339 372l-9 17c-2 6 3 11 10 11h55c10 0 17-5 17-12l-24-11"/>
    <!-- working leg bent behind -->
    <path d="M413 245l18 49 49 14c16 5 25 17 20 27-4 8-15 10-27 7l-60-13c-17-4-29-15-33-30l-13-48" fill="#fff"/>
    <path d="M475 306l16 6" stroke="#a9b6af"/>
  </g>
  <!-- ankle cuff and low cable -->
  <path d="M474 322l-17 15" stroke="#78b847" stroke-width="12" stroke-linecap="round"/>
  <path d="M457 337c-95 8-184 4-264-8l-55-10" fill="none" stroke="#78b847" stroke-width="6" stroke-dasharray="11 9"/>
  <path d="M180 319l-27-2" stroke="#78b847" stroke-width="6" stroke-linecap="round"/>
  <rect x="178" y="299" width="23" height="37" rx="8" fill="#dff0d1" stroke="#78b847" stroke-width="5" transform="rotate(9 189 318)"/>
  <text x="320" y="393" text-anchor="middle" fill="#718278" font-family="Arial, sans-serif" font-size="18">Сгибай колено, не раскачивая корпус</text>
</svg>
